<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #fff;
    }

    .model-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .model-btn {
      padding: 0.5rem 1.25rem;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #999;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.15s;
    }

    .model-btn.active {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
    }

    .model-btn:hover:not(.active) {
      border-color: #555;
      color: #ccc;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: none;
      border-color: #d97706;
    }

    .image-upload-area {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .image-slot {
      width: 100px;
      height: 100px;
      border: 2px dashed #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s;
      flex-shrink: 0;
    }

    .image-slot:hover { border-color: #555; }

    .image-slot input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .image-slot .plus {
      font-size: 1.5rem;
      color: #555;
      pointer-events: none;
    }

    .image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .image-slot .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.75rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .image-slot.has-image .remove-btn { display: flex; }
    .image-slot.has-image .plus { display: none; }
    .image-slot.has-image input { display: none; }

    .submit-btn {
      padding: 0.65rem 2rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover { background: #b45309; }
    .submit-btn:disabled { background: #555; cursor: not-allowed; }

    .response-area {
      margin-top: 2rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.25rem;
      min-height: 100px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
    }

    .response-area.visible { display: block; }

    .status {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #777;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #555;
      border-top-color: #d97706;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Claude API</h1>

    <div class="model-selector">
      <button class="model-btn active" data-model="sonnet">Sonnet</button>
      <button class="model-btn" data-model="opus">Opus</button>
    </div>

    <textarea id="prompt" placeholder="Enter your prompt..."></textarea>

    <div class="image-upload-area" id="imageArea"></div>

    <button class="submit-btn" id="submitBtn">Submit</button>

    <div class="response-area" id="response"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    let selectedModel = 'sonnet';
    const imageFiles = [null, null, null, null, null];

    // Model selector
    document.querySelectorAll('.model-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedModel = btn.dataset.model;
      });
    });

    // Create image slots
    const imageArea = document.getElementById('imageArea');
    for (let i = 0; i < 5; i++) {
      const slot = document.createElement('div');
      slot.className = 'image-slot';
      slot.innerHTML = `
        <span class="plus">+</span>
        <input type="file" accept="image/*">
        <button class="remove-btn" title="Remove">&times;</button>
      `;

      const input = slot.querySelector('input');
      const removeBtn = slot.querySelector('.remove-btn');

      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        imageFiles[i] = file;

        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = document.createElement('img');
          img.src = ev.target.result;
          // Remove old img if exists
          const old = slot.querySelector('img');
          if (old) old.remove();
          slot.insertBefore(img, removeBtn);
          slot.classList.add('has-image');
        };
        reader.readAsDataURL(file);
      });

      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        imageFiles[i] = null;
        const img = slot.querySelector('img');
        if (img) img.remove();
        slot.classList.remove('has-image');
        input.value = '';
      });

      imageArea.appendChild(slot);
    }

    // Submit
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;

      const submitBtn = document.getElementById('submitBtn');
      const responseDiv = document.getElementById('response');
      const statusDiv = document.getElementById('status');

      submitBtn.disabled = true;
      responseDiv.textContent = '';
      responseDiv.classList.add('visible');
      statusDiv.innerHTML = '<span class="spinner"></span> Waiting for response...';

      const formData = new FormData();
      formData.append('prompt', prompt);
      formData.append('model', selectedModel);

      for (const file of imageFiles) {
        if (file) formData.append('images', file);
      }

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          body: formData,
        });

        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.error || 'Request failed');
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.slice(6));

            if (data.error) {
              throw new Error(data.error);
            }

            if (data.text) {
              responseDiv.textContent += data.text;
            }

            if (data.done) {
              statusDiv.textContent = `Done — ${data.usage.input_tokens} input / ${data.usage.output_tokens} output tokens`;
            }
          }
        }
      } catch (err) {
        statusDiv.textContent = '';
        responseDiv.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
