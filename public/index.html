<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #111;
    }

    .logout-btn {
      padding: 0.4rem 0.9rem;
      background: none;
      color: #888;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .logout-btn:hover {
      color: #dc2626;
      border-color: #dc2626;
    }

    .model-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .model-btn {
      padding: 0.5rem 1.25rem;
      border: 1px solid #ccc;
      background: #fff;
      color: #666;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.15s;
    }

    .model-btn.active {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
    }

    .model-btn:hover:not(.active) {
      border-color: #999;
      color: #333;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: #1a1a1a;
      padding: 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: none;
      border-color: #d97706;
    }

    .image-upload-area {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .image-slot {
      width: 100px;
      height: 100px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s;
      flex-shrink: 0;
    }

    .image-slot:hover { border-color: #999; }

    .image-slot input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .image-slot .plus {
      font-size: 1.5rem;
      color: #aaa;
      pointer-events: none;
    }

    .image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .image-slot .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.75rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .image-slot.has-image .remove-btn { display: flex; }
    .image-slot.has-image .plus { display: none; }
    .image-slot.has-image input { display: none; }

    .submit-btn {
      padding: 0.65rem 2rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover { background: #b45309; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    .response-wrapper {
      margin-top: 2rem;
      display: none;
    }

    .response-wrapper.visible { display: block; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #e8e8e8;
      border: 1px solid #ccc;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      color: #666;
    }

    .status-bar .left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-bar .char-count {
      color: #999;
      font-size: 0.75rem;
    }

    .download-btn {
      padding: 0.35rem 0.85rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
      display: none;
    }

    .download-btn:hover { background: #b45309; }
    .download-btn.visible { display: inline-block; }

    .progress-bar-track {
      height: 3px;
      background: #ddd;
      overflow: hidden;
    }

    .progress-bar-track.hidden { display: none; }

    .progress-bar-fill {
      height: 100%;
      background: #d97706;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-bar-fill.indeterminate {
      width: 30%;
      animation: indeterminate 1.5s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    .response-area {
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 1.25rem;
      min-height: 100px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #d97706;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Claude API</h1>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>

    <div class="model-selector">
      <button class="model-btn active" data-model="sonnet">Sonnet</button>
      <button class="model-btn" data-model="opus">Opus</button>
    </div>

    <textarea id="prompt" placeholder="Enter your prompt..."></textarea>

    <div class="image-upload-area" id="imageArea"></div>

    <button class="submit-btn" id="submitBtn">Submit</button>

    <div class="response-wrapper" id="responseWrapper">
      <div class="status-bar">
        <div class="left">
          <span id="statusText">Ready</span>
          <span class="char-count" id="charCount"></span>
        </div>
        <button class="download-btn" id="downloadBtn">Download .md</button>
      </div>
      <div class="progress-bar-track hidden" id="progressTrack">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="response-area" id="response"></div>
    </div>
  </div>

  <script>
    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    let selectedModel = 'sonnet';
    const imageFiles = [null, null, null, null, null];

    // Model selector
    document.querySelectorAll('.model-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedModel = btn.dataset.model;
      });
    });

    // Create image slots
    const imageArea = document.getElementById('imageArea');
    for (let i = 0; i < 5; i++) {
      const slot = document.createElement('div');
      slot.className = 'image-slot';
      slot.innerHTML = `
        <span class="plus">+</span>
        <input type="file" accept="image/*">
        <button class="remove-btn" title="Remove">&times;</button>
      `;

      const input = slot.querySelector('input');
      const removeBtn = slot.querySelector('.remove-btn');

      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        imageFiles[i] = file;

        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = document.createElement('img');
          img.src = ev.target.result;
          // Remove old img if exists
          const old = slot.querySelector('img');
          if (old) old.remove();
          slot.insertBefore(img, removeBtn);
          slot.classList.add('has-image');
        };
        reader.readAsDataURL(file);
      });

      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        imageFiles[i] = null;
        const img = slot.querySelector('img');
        if (img) img.remove();
        slot.classList.remove('has-image');
        input.value = '';
      });

      imageArea.appendChild(slot);
    }

    // Download .md
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const text = document.getElementById('response').textContent;
      const blob = new Blob([text], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'response.md';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Submit
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;

      const submitBtn = document.getElementById('submitBtn');
      const responseDiv = document.getElementById('response');
      const wrapper = document.getElementById('responseWrapper');
      const statusText = document.getElementById('statusText');
      const charCount = document.getElementById('charCount');
      const progressTrack = document.getElementById('progressTrack');
      const progressFill = document.getElementById('progressFill');
      const downloadBtn = document.getElementById('downloadBtn');

      submitBtn.disabled = true;
      responseDiv.textContent = '';
      wrapper.classList.add('visible');
      downloadBtn.classList.remove('visible');
      statusText.innerHTML = '<span class="spinner"></span> Generating response...';
      charCount.textContent = '';
      progressTrack.classList.remove('hidden');
      progressFill.className = 'progress-bar-fill indeterminate';
      progressFill.style.width = '';

      const startTime = Date.now();
      let totalChars = 0;

      const formData = new FormData();
      formData.append('prompt', prompt);
      formData.append('model', selectedModel);

      for (const file of imageFiles) {
        if (file) formData.append('images', file);
      }

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          body: formData,
        });

        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.error || 'Request failed');
        }

        // Switch from indeterminate to determinate progress
        progressFill.classList.remove('indeterminate');

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.slice(6));

            if (data.error) {
              throw new Error(data.error);
            }

            if (data.text) {
              responseDiv.textContent += data.text;
              totalChars += data.text.length;
              const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
              charCount.textContent = `${totalChars.toLocaleString()} chars · ${elapsed}s`;
              // Estimate progress (assuming ~30k char max)
              const pct = Math.min(95, (totalChars / 30000) * 100);
              progressFill.style.width = pct + '%';
            }

            if (data.done) {
              const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
              progressFill.style.width = '100%';
              statusText.textContent = `Done — ${data.usage.input_tokens.toLocaleString()} input / ${data.usage.output_tokens.toLocaleString()} output tokens`;
              charCount.textContent = `${totalChars.toLocaleString()} chars · ${elapsed}s`;
              downloadBtn.classList.add('visible');
              setTimeout(() => { progressTrack.classList.add('hidden'); }, 500);
            }
          }
        }
      } catch (err) {
        statusText.textContent = 'Error';
        charCount.textContent = '';
        responseDiv.textContent = 'Error: ' + err.message;
        progressTrack.classList.add('hidden');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
