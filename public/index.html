<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude API</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #111;
    }

    .logout-btn {
      padding: 0.4rem 0.9rem;
      background: none;
      color: #888;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .logout-btn:hover {
      color: #dc2626;
      border-color: #dc2626;
    }

    .model-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .model-btn {
      padding: 0.5rem 1.25rem;
      border: 1px solid #ccc;
      background: #fff;
      color: #666;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.15s;
    }

    .model-btn.active {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
    }

    .model-btn:hover:not(.active) {
      border-color: #999;
      color: #333;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: #1a1a1a;
      padding: 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: none;
      border-color: #d97706;
    }

    .dropzone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .dropzone:hover { border-color: #999; }

    .dropzone.dragover {
      border-color: #d97706;
      background: #fffbeb;
    }

    .dropzone-label {
      color: #999;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .dropzone-label strong {
      color: #d97706;
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .image-thumbs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .image-thumbs:empty { margin-top: 0; }

    .image-thumb {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid #ddd;
    }

    .image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-thumb .thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-thumb .thumb-remove:hover { background: #dc2626; }

    .image-count {
      font-size: 0.75rem;
      color: #888;
      margin-top: 0.5rem;
    }

    /* Text / HTML file upload */
    .textfile-dropzone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .textfile-dropzone:hover { border-color: #999; }

    .textfile-dropzone.dragover {
      border-color: #d97706;
      background: #fffbeb;
    }

    .textfile-dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .textfile-dropzone-label {
      color: #999;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .textfile-dropzone-label strong { color: #d97706; }

    .textfile-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    .textfile-chips:empty { margin-top: 0; }

    .textfile-chip {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 0.2rem 0.6rem 0.2rem 0.75rem;
      font-size: 0.78rem;
      color: #444;
      max-width: 220px;
    }

    .textfile-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .textfile-chip-remove {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }

    .textfile-chip-remove:hover { color: #dc2626; }

    .submit-btn {
      padding: 0.65rem 2rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover { background: #b45309; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    .reset-btn {
      padding: 0.65rem 2rem;
      background: #fff;
      color: #666;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-left: 0.5rem;
      transition: all 0.15s;
    }

    .reset-btn:hover { border-color: #999; color: #333; }

    /* --- Notes Section --- */
    .notes-section {
      margin-top: 2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: #e8e8e8;
      cursor: pointer;
      user-select: none;
    }

    .notes-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
    }

    .notes-header .toggle-arrow {
      font-size: 0.75rem;
      color: #888;
      transition: transform 0.2s;
    }

    .notes-header .toggle-arrow.open {
      transform: rotate(180deg);
    }

    .notes-body {
      display: none;
      padding: 1rem;
    }

    .notes-body.open {
      display: block;
    }

    .notes-toolbar {
      margin-bottom: 1rem;
    }

    .add-note-btn {
      padding: 0.4rem 1rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-note-btn:hover { background: #b45309; }

    /* Sub-sections */
    .notes-subsection {
      margin-bottom: 1.25rem;
    }

    .notes-subsection:last-child {
      margin-bottom: 0;
    }

    .notes-subsection-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.65rem;
      background: #f3f3f3;
      border: 1px solid #e0e0e0;
      border-radius: 5px;
      margin-bottom: 0.6rem;
      user-select: none;
    }

    .notes-subsection-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 4px;
    }

    .notes-list.drag-over {
      outline: 2px dashed #d97706;
      outline-offset: 3px;
      border-radius: 4px;
    }

    .note-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    .note-card:hover { border-color: #bbb; }

    .note-card.dragging { opacity: 0.35; }

    .note-card.drag-above { box-shadow: 0 -2px 0 0 #d97706; }
    .note-card.drag-below { box-shadow: 0 2px 0 0 #d97706; }

    .note-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.85rem;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .note-drag-handle {
      color: #bbb;
      font-size: 0.9rem;
      cursor: grab;
      margin-right: 0.45rem;
      flex-shrink: 0;
      line-height: 1;
      padding: 2px 3px;
    }

    .note-drag-handle:active { cursor: grabbing; }
    .note-drag-handle:hover { color: #888; }

    .note-title {
      font-weight: 500;
      font-size: 0.9rem;
      color: #333;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-actions {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
      margin-left: 0.75rem;
    }

    .note-action-btn {
      padding: 0.25rem 0.55rem;
      border: 1px solid #ccc;
      background: #fff;
      color: #666;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .note-action-btn:hover { border-color: #999; color: #333; }
    .note-action-btn.delete:hover { border-color: #dc2626; color: #dc2626; }
    .note-action-btn.copy:hover { border-color: #16a34a; color: #16a34a; }

    .note-expanded {
      display: none;
      padding: 0.6rem 0.85rem;
      border-top: 1px solid #eee;
    }

    .note-card.expanded .note-expanded { display: block; }

    .note-command-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .note-command-text {
      flex: 1;
      font-size: 0.8rem;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      color: #000;
      background: #f0f0f0;
      padding: 0.5rem 0.65rem;
      border-radius: 4px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    .copy-command-btn {
      padding: 0.3rem 0.6rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .copy-command-btn:hover { background: #b45309; }

    .note-notes-text {
      font-size: 0.8rem;
      color: #000;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .note-field-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.25rem;
    }

    .notes-empty {
      text-align: center;
      color: #bbb;
      font-size: 0.8rem;
      padding: 0.75rem 0;
      font-style: italic;
    }

    /* Note edit modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #eee;
    }

    .modal-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #111;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: #999;
      cursor: pointer;
    }

    .modal-close:hover { color: #333; }

    .modal-body {
      padding: 1.25rem;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #555;
      margin-bottom: 0.3rem;
    }

    .modal-body input[type="text"],
    .modal-body select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1a1a1a;
      background: #fff;
      margin-bottom: 1rem;
    }

    .modal-body input[type="text"]:focus,
    .modal-body select:focus {
      outline: none;
      border-color: #d97706;
    }

    .modal-body textarea {
      min-height: 250px;
      margin-bottom: 0;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      border-top: 1px solid #eee;
    }

    .modal-cancel-btn {
      padding: 0.5rem 1.25rem;
      background: #fff;
      color: #666;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .modal-cancel-btn:hover { border-color: #999; color: #333; }

    .modal-save-btn {
      padding: 0.5rem 1.25rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .modal-save-btn:hover { background: #b45309; }

    .copied-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 2000;
      pointer-events: none;
    }

    .copied-toast.visible { opacity: 1; }

    /* --- Response Section --- */
    .response-wrapper {
      margin-top: 2rem;
      display: none;
    }

    .response-wrapper.visible { display: block; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #e8e8e8;
      border: 1px solid #ccc;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      color: #666;
    }

    .status-bar .left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-bar .char-count {
      color: #999;
      font-size: 0.75rem;
    }

    .response-actions {
      display: none;
      gap: 0.35rem;
    }

    .response-actions.visible { display: flex; }

    .download-btn {
      padding: 0.35rem 0.85rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .download-btn:hover { background: #b45309; }

    .progress-bar-track {
      height: 3px;
      background: #ddd;
      overflow: hidden;
    }

    .progress-bar-track.hidden { display: none; }

    .progress-bar-fill {
      height: 100%;
      background: #d97706;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-bar-fill.indeterminate {
      width: 30%;
      animation: indeterminate 1.5s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    .response-area {
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 1.25rem;
      min-height: 100px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #d97706;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Claude API</h1>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>

    <div class="model-selector">
      <button class="model-btn active" data-model="sonnet">Sonnet</button>
      <button class="model-btn" data-model="opus">Opus</button>
    </div>

    <textarea id="prompt" placeholder="Enter your prompt..."></textarea>

    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="dropzone-label">Drag & drop images here or <strong>click to browse</strong></div>
      <div class="image-thumbs" id="imageThumbs"></div>
      <div class="image-count" id="imageCount"></div>
    </div>

    <!-- Text / HTML file upload (optional) -->
    <div class="textfile-dropzone" id="textfileDropzone">
      <input type="file" id="textfileInput" accept=".txt,.html,.htm" multiple>
      <div class="textfile-dropzone-label">Optionally attach <strong>.txt or .html</strong> files — contents will be sent with your prompt</div>
      <div class="textfile-chips" id="textfileChips"></div>
    </div>

    <button class="submit-btn" id="submitBtn">Submit</button>
    <button class="reset-btn" id="resetBtn">Reset</button>

    <!-- Notes Section -->
    <div class="notes-section">
      <div class="notes-header" id="notesToggle">
        <h2>Saved Notes / Scripts</h2>
        <span class="toggle-arrow open" id="toggleArrow">&#9660;</span>
      </div>
      <div class="notes-body open" id="notesBody">
        <div class="notes-toolbar">
          <button class="add-note-btn" id="addNoteBtn">+ New Note</button>
        </div>

        <!-- Creative Copy sub-section -->
        <div class="notes-subsection">
          <div class="notes-subsection-header">
            <span class="notes-subsection-title">Creative Copy</span>
          </div>
          <div class="notes-list" id="listCreativeCopy" data-section="creative_copy">
            <div class="notes-empty">No notes yet</div>
          </div>
        </div>

        <!-- Images sub-section -->
        <div class="notes-subsection">
          <div class="notes-subsection-header">
            <span class="notes-subsection-title">Images</span>
          </div>
          <div class="notes-list" id="listImages" data-section="images">
            <div class="notes-empty">No notes yet</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Response Section -->
    <div class="response-wrapper" id="responseWrapper">
      <div class="status-bar">
        <div class="left">
          <span id="statusText">Ready</span>
          <span class="char-count" id="charCount"></span>
        </div>
        <div class="response-actions" id="responseActions">
          <button class="download-btn" id="copyResponseBtn">Copy</button>
          <button class="download-btn" id="downloadBtn">Download .md</button>
          <button class="download-btn" id="downloadTxtBtn">Download .txt</button>
        </div>
      </div>
      <div class="progress-bar-track hidden" id="progressTrack">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="response-area" id="response"></div>
    </div>
  </div>

  <!-- Edit/Create Note Modal -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">New Note</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <label for="noteTitle">Title</label>
        <input type="text" id="noteTitle" placeholder="Note title...">
        <label for="noteSection">Section</label>
        <select id="noteSection">
          <option value="creative_copy">Creative Copy</option>
          <option value="images">Images</option>
        </select>
        <label for="noteCommand">Command</label>
        <textarea id="noteCommand" placeholder="Paste your command or script here..."></textarea>
        <label for="noteNotes" style="margin-top: 1rem;">Notes</label>
        <textarea id="noteNotes" placeholder="Optional notes about this command..." style="min-height: 100px;"></textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-cancel-btn" id="modalCancel">Cancel</button>
        <button class="modal-save-btn" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Copied toast -->
  <div class="copied-toast" id="copiedToast">Copied to clipboard</div>

  <script>
    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('prompt').value = '';
      imageFiles = [];
      document.getElementById('imageThumbs').innerHTML = '';
      document.getElementById('imageCount').textContent = '';
      document.getElementById('responseWrapper').classList.remove('visible');
      document.getElementById('response').textContent = '';
      document.getElementById('fileInput').value = '';
      textFiles = [];
      document.getElementById('textfileChips').innerHTML = '';
    });

    let selectedModel = 'sonnet';
    let imageFiles = [];

    // Model selector
    document.querySelectorAll('.model-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedModel = btn.dataset.model;
      });
    });

    // Drag & drop image upload
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const imageThumbs = document.getElementById('imageThumbs');
    const imageCountEl = document.getElementById('imageCount');

    function addFiles(files) {
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        imageFiles.push(file);
        createThumb(file, imageFiles.length - 1);
      }
      updateImageCount();
    }

    function createThumb(file, index) {
      const thumb = document.createElement('div');
      thumb.className = 'image-thumb';
      thumb.dataset.index = index;

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = document.createElement('img');
        img.src = ev.target.result;
        thumb.prepend(img);
      };
      reader.readAsDataURL(file);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'thumb-remove';
      removeBtn.innerHTML = '&times;';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(thumb.dataset.index);
        imageFiles[idx] = null;
        thumb.remove();
        updateImageCount();
      });

      thumb.appendChild(removeBtn);
      imageThumbs.appendChild(thumb);
    }

    function updateImageCount() {
      const count = imageFiles.filter(f => f !== null).length;
      imageCountEl.textContent = count > 0 ? `${count} image${count !== 1 ? 's' : ''} attached` : '';
    }

    // Click to browse
    fileInput.addEventListener('change', (e) => {
      addFiles(e.target.files);
      fileInput.value = '';
    });

    // Drag events
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      addFiles(e.dataTransfer.files);
    });

    // ==================== TEXT / HTML FILE UPLOAD ====================
    const textfileDropzone = document.getElementById('textfileDropzone');
    const textfileInput = document.getElementById('textfileInput');
    const textfileChips = document.getElementById('textfileChips');
    let textFiles = []; // [{ name, content }]

    function readTextFiles(files) {
      for (const file of files) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['txt', 'html', 'htm'].includes(ext)) continue;
        const reader = new FileReader();
        reader.onload = (ev) => {
          textFiles.push({ name: file.name, content: ev.target.result });
          addTextChip(file.name, textFiles.length - 1);
        };
        reader.readAsText(file);
      }
    }

    function addTextChip(name, index) {
      const chip = document.createElement('div');
      chip.className = 'textfile-chip';
      chip.dataset.index = index;
      chip.innerHTML = `<span title="${escapeHtml(name)}">${escapeHtml(name)}</span>`;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'textfile-chip-remove';
      removeBtn.innerHTML = '&times;';
      removeBtn.title = 'Remove';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        textFiles[parseInt(chip.dataset.index)] = null;
        chip.remove();
      });
      chip.appendChild(removeBtn);
      textfileChips.appendChild(chip);
    }

    textfileInput.addEventListener('change', (e) => {
      readTextFiles(e.target.files);
      textfileInput.value = '';
    });

    textfileDropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      textfileDropzone.classList.add('dragover');
    });

    textfileDropzone.addEventListener('dragleave', () => {
      textfileDropzone.classList.remove('dragover');
    });

    textfileDropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      textfileDropzone.classList.remove('dragover');
      readTextFiles(e.dataTransfer.files);
    });

    // Copy response
    document.getElementById('copyResponseBtn').addEventListener('click', async () => {
      const text = document.getElementById('response').textContent;
      await navigator.clipboard.writeText(text);
      showToast('Response copied to clipboard');
    });

    // Download .md
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const text = document.getElementById('response').textContent;
      const blob = new Blob([text], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'response.md';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Download .txt
    document.getElementById('downloadTxtBtn').addEventListener('click', () => {
      const text = document.getElementById('response').textContent;
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'response.txt';
      a.click();
      URL.revokeObjectURL(url);
    });

    // ==================== NOTES ====================
    const notesToggle = document.getElementById('notesToggle');
    const notesBody = document.getElementById('notesBody');
    const toggleArrow = document.getElementById('toggleArrow');
    const noteModal = document.getElementById('noteModal');
    const modalTitle = document.getElementById('modalTitle');
    const noteTitleInput = document.getElementById('noteTitle');
    const noteSectionInput = document.getElementById('noteSection');
    const noteCommandInput = document.getElementById('noteCommand');
    const noteNotesInput = document.getElementById('noteNotes');
    const copiedToast = document.getElementById('copiedToast');

    let editingNoteId = null;

    // Toggle notes panel
    notesToggle.addEventListener('click', () => {
      notesBody.classList.toggle('open');
      toggleArrow.classList.toggle('open');
    });

    // Open modal for new note
    document.getElementById('addNoteBtn').addEventListener('click', () => {
      editingNoteId = null;
      modalTitle.textContent = 'New Note';
      noteTitleInput.value = '';
      noteSectionInput.value = 'creative_copy';
      noteCommandInput.value = '';
      noteNotesInput.value = '';
      noteModal.classList.add('visible');
      noteTitleInput.focus();
    });

    // Close modal
    function closeModal() {
      noteModal.classList.remove('visible');
      editingNoteId = null;
    }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    noteModal.addEventListener('click', (e) => {
      if (e.target === noteModal) closeModal();
    });

    // Save note
    document.getElementById('modalSave').addEventListener('click', async () => {
      const title = noteTitleInput.value.trim() || 'Untitled';
      const section = noteSectionInput.value;
      const command = noteCommandInput.value;
      const notes = noteNotesInput.value;

      if (editingNoteId) {
        await fetch(`/api/notes/${editingNoteId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, section, command, notes }),
        });
      } else {
        await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, section, command, notes }),
        });
      }

      closeModal();
      loadNotes();
    });

    // Show toast
    function showToast(msg) {
      copiedToast.textContent = msg;
      copiedToast.classList.add('visible');
      setTimeout(() => copiedToast.classList.remove('visible'), 1500);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ==================== DRAG & DROP REORDER ====================
    let dragSrcCard = null;

    function makeDraggable(card) {
      card.setAttribute('draggable', 'true');

      card.addEventListener('dragstart', (e) => {
        dragSrcCard = card;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.dataset.id);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        document.querySelectorAll('.note-card').forEach(c => {
          c.classList.remove('drag-above', 'drag-below');
        });
        document.querySelectorAll('.notes-list').forEach(l => l.classList.remove('drag-over'));
        dragSrcCard = null;
      });

      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!dragSrcCard || dragSrcCard === card) return;
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.note-card').forEach(c => c.classList.remove('drag-above', 'drag-below'));
        const rect = card.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (e.clientY < mid) {
          card.classList.add('drag-above');
        } else {
          card.classList.add('drag-below');
        }
      });

      card.addEventListener('dragleave', () => {
        card.classList.remove('drag-above', 'drag-below');
      });

      card.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragSrcCard || dragSrcCard === card) return;
        const list = card.closest('.notes-list');
        const rect = card.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (e.clientY < mid) {
          list.insertBefore(dragSrcCard, card);
        } else {
          list.insertBefore(dragSrcCard, card.nextSibling);
        }
        card.classList.remove('drag-above', 'drag-below');
        saveOrder(list);
      });
    }

    // Wire up list containers so dropping onto empty space works
    function setupListDrop(list) {
      list.addEventListener('dragover', (e) => {
        // Only if hovering on the list itself, not a card
        if (e.target === list) {
          e.preventDefault();
          list.classList.add('drag-over');
        }
      });

      list.addEventListener('dragleave', (e) => {
        if (e.target === list) list.classList.remove('drag-over');
      });

      list.addEventListener('drop', (e) => {
        if (e.target !== list) return;
        e.preventDefault();
        list.classList.remove('drag-over');
        if (!dragSrcCard) return;
        list.appendChild(dragSrcCard);
        saveOrder(list);
      });
    }

    async function saveOrder(list) {
      const cards = list.querySelectorAll('.note-card');
      const orders = Array.from(cards).map((c, i) => ({
        id: parseInt(c.dataset.id),
        sort_order: i + 1,
      }));
      await fetch('/api/notes/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orders }),
      });
    }

    // Render notes into their sub-section lists
    function renderNotes(notes) {
      const lists = {
        creative_copy: document.getElementById('listCreativeCopy'),
        images: document.getElementById('listImages'),
      };

      // Clear existing cards (keep empty placeholder)
      for (const list of Object.values(lists)) {
        list.querySelectorAll('.note-card').forEach(c => c.remove());
        const empty = list.querySelector('.notes-empty');
        if (empty) empty.style.display = 'block';
      }

      const bySection = { creative_copy: [], images: [] };
      notes.forEach(n => {
        const sec = n.section === 'images' ? 'images' : 'creative_copy';
        bySection[sec].push(n);
      });

      for (const [section, sectionNotes] of Object.entries(bySection)) {
        const list = lists[section];
        const empty = list.querySelector('.notes-empty');
        if (sectionNotes.length === 0) {
          if (empty) empty.style.display = 'block';
          continue;
        }
        if (empty) empty.style.display = 'none';

        sectionNotes.forEach(note => {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.dataset.id = note.id;

          const notesHtml = note.notes
            ? `<div class="note-field-label">Notes</div><div class="note-notes-text">${escapeHtml(note.notes)}</div>`
            : '';

          card.innerHTML = `
            <div class="note-card-header">
              <span class="note-drag-handle" title="Drag to reorder">&#8942;&#8942;</span>
              <span class="note-title">${escapeHtml(note.title)}</span>
              <div class="note-actions">
                <button class="note-action-btn edit" title="Edit">Edit</button>
                <button class="note-action-btn delete" title="Delete">Delete</button>
              </div>
            </div>
            <div class="note-expanded">
              ${notesHtml}
              ${notesHtml ? '<div style="margin-bottom: 0.5rem;"></div>' : ''}
              <div class="note-field-label">Command</div>
              <div class="note-command-row">
                <div class="note-command-text">${escapeHtml(note.command || '')}</div>
                <button class="copy-command-btn">Copy</button>
              </div>
            </div>
          `;

          // Toggle expand (not on drag handle or actions)
          card.querySelector('.note-card-header').addEventListener('click', (e) => {
            if (e.target.closest('.note-actions') || e.target.closest('.note-drag-handle')) return;
            card.classList.toggle('expanded');
          });

          // Copy command
          card.querySelector('.copy-command-btn').addEventListener('click', async () => {
            await navigator.clipboard.writeText(note.command || '');
            showToast('Command copied to clipboard');
          });

          // Edit
          card.querySelector('.edit').addEventListener('click', () => {
            editingNoteId = note.id;
            modalTitle.textContent = 'Edit Note';
            noteTitleInput.value = note.title;
            noteSectionInput.value = note.section === 'images' ? 'images' : 'creative_copy';
            noteCommandInput.value = note.command || '';
            noteNotesInput.value = note.notes || '';
            noteModal.classList.add('visible');
            noteTitleInput.focus();
          });

          // Delete
          card.querySelector('.delete').addEventListener('click', async () => {
            if (!confirm(`Delete "${note.title}"?`)) return;
            await fetch(`/api/notes/${note.id}`, { method: 'DELETE' });
            loadNotes();
          });

          makeDraggable(card);
          list.appendChild(card);
        });
      }
    }

    // Set up drop zones on page load
    document.querySelectorAll('.notes-list').forEach(setupListDrop);

    // Load notes from API
    async function loadNotes() {
      try {
        const resp = await fetch('/api/notes');
        if (resp.ok) {
          const notes = await resp.json();
          renderNotes(notes);
        }
      } catch (err) {
        console.error('Failed to load notes:', err);
      }
    }

    // Load notes on page load
    loadNotes();

    // ==================== SUBMIT ====================
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;

      const submitBtn = document.getElementById('submitBtn');
      const responseDiv = document.getElementById('response');
      const wrapper = document.getElementById('responseWrapper');
      const statusText = document.getElementById('statusText');
      const charCount = document.getElementById('charCount');
      const progressTrack = document.getElementById('progressTrack');
      const progressFill = document.getElementById('progressFill');
      const responseActions = document.getElementById('responseActions');

      submitBtn.disabled = true;
      responseDiv.textContent = '';
      wrapper.classList.add('visible');
      responseActions.classList.remove('visible');
      statusText.innerHTML = '<span class="spinner"></span> Generating response...';
      charCount.textContent = '';
      progressTrack.classList.remove('hidden');
      progressFill.className = 'progress-bar-fill indeterminate';
      progressFill.style.width = '';

      const startTime = Date.now();
      let totalChars = 0;

      const formData = new FormData();
      formData.append('prompt', prompt);
      formData.append('model', selectedModel);

      for (const file of imageFiles) {
        if (file) formData.append('images', file);
      }

      const activeTextFiles = textFiles.filter(f => f !== null);
      if (activeTextFiles.length > 0) {
        formData.append('textFilesData', JSON.stringify(activeTextFiles));
      }

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          body: formData,
        });

        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.error || 'Request failed');
        }

        // Switch from indeterminate to determinate progress
        progressFill.classList.remove('indeterminate');

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.slice(6));

            if (data.error) {
              throw new Error(data.error);
            }

            if (data.text) {
              responseDiv.textContent += data.text;
              totalChars += data.text.length;
              const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
              charCount.textContent = `${totalChars.toLocaleString()} chars · ${elapsed}s`;
              const pct = Math.min(95, (totalChars / 30000) * 100);
              progressFill.style.width = pct + '%';
            }

            if (data.done) {
              const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
              progressFill.style.width = '100%';
              statusText.textContent = `Done — ${data.usage.input_tokens.toLocaleString()} input / ${data.usage.output_tokens.toLocaleString()} output tokens`;
              charCount.textContent = `${totalChars.toLocaleString()} chars · ${elapsed}s`;
              responseActions.classList.add('visible');
              setTimeout(() => { progressTrack.classList.add('hidden'); }, 500);
            }
          }
        }
      } catch (err) {
        statusText.textContent = 'Error';
        charCount.textContent = '';
        responseDiv.textContent = 'Error: ' + err.message;
        progressTrack.classList.add('hidden');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
