<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Claude API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #111;
    }

    .subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 0.4rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: #1a1a1a;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #d97706;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #d97706;
      cursor: pointer;
    }

    .remember-row label {
      margin: 0;
      font-weight: 400;
      color: #555;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 0.7rem;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .login-btn:hover { background: #b45309; }
    .login-btn:disabled { background: #ccc; cursor: not-allowed; }

    .error-msg {
      margin-top: 1rem;
      color: #dc2626;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Claude API</h1>
    <p class="subtitle">Enter your password to continue</p>

    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus>

      <div class="remember-row">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me for 30 days</label>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Log In</button>
    </form>

    <div class="error-msg" id="errorMsg">Incorrect password. Please try again.</div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const loginBtn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      if (!password) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      errorMsg.classList.remove('visible');

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, remember: remember ? 'on' : 'off' }),
        });

        if (resp.ok) {
          window.location.href = '/';
        } else {
          errorMsg.classList.add('visible');
          document.getElementById('password').select();
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('visible');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
